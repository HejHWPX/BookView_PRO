<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박물관 스타일 디지털 독서 뷰어</title>
    <style>
        :root {
            /* 박물관 갤러리 톤 (연한 노란빛 벽면과 클래식한 바닥) */
            --wall-color: #fcf8ec;
            --floor-color: #7a1c1c;
            --text-color: #2c2c2c;
            --frame-gold: #c5a059;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--wall-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* 박물관 하단 바닥 레이어 추가 */
        body::after {
            content: "";
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: var(--floor-color);
            border-top: 5px solid #501010;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
            z-index: -1;
        }

        /* 1. 상단 스포트라이트 효과 (메인 화면 벽면 비추는 빛 조명) */
        .spotlight-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 350px;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% -20%, rgba(255, 255, 200, 0.6) 0%, rgba(255, 255, 200, 0.15) 40%, transparent 70%);
            z-index: 1;
        }

        header {
            margin: 40px 0 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 1.8rem;
            color: #3b2f2f;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* 1. 메인 화면 (박물관 액자 스타일 표지 갤러리) */
        #selection-view {
            width: 100%;
            max-width: 1100px;
            padding: 0 20px 80px;
            position: relative;
            z-index: 2;
        }

        #book-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 35px;
            justify-items: center;
        }

        /* 박물관 액자 프레임 */
        .book-card {
            background: #fff;
            padding: 12px 12px 28px 12px;
            border: 4px solid var(--frame-gold);
            border-radius: 4px;
            box-shadow: 0 10px 25px var(--shadow-color), inset 0 0 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            max-width: 200px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .book-card img {
            width: 100%;
            aspect-ratio: 1 / 1.414; /* A4 비율 */
            object-fit: cover;
            background-color: #e0e0e0;
            border: 1px solid #ddd;
        }

        .book-card-title {
            padding-top: 12px;
            font-size: 0.95rem;
            text-align: center;
            font-weight: bold;
            color: #444;
        }

        /* 2. 로딩 화면 */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(252, 248, 236, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #dcd6c8;
            border-top: 5px solid var(--frame-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 3. 독서 뷰어 화면 */
        #viewer-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            display: none;
            position: relative;
            overflow: hidden;
            z-index: 10;
            background-color: #2b2b2b;
        }

        /* 뷰어 상단 컨트롤러 (레트로 스타일 버튼 및 백터 아이콘) */
        .viewer-header {
            height: 65px;
            background: #fdfbf7;
            border-bottom: 2px solid #e3dcd0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
        }

        .viewer-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* 레트로 스타일 버튼 디자인 */
        button.retro-btn {
            padding: 7px 14px;
            border: 2px solid #5a4a35;
            background: linear-gradient(to bottom, #fffdf9, #f2eade);
            color: #3b2f2f;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 0 #5a4a35, 0 4px 6px rgba(0,0,0,0.15);
            transition: all 0.1s ease;
        }

        button.retro-btn:hover {
            background: linear-gradient(to bottom, #ffffff, #eae3d2);
        }

        button.retro-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #5a4a35, 0 2px 3px rgba(0,0,0,0.15);
        }

        /* 벡터 SVG 아이콘 스타일 */
        .retro-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 책 읽는 메인 스테이지 (양면 펼침 레이아웃) */
        .viewer-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: auto;
            background-color: #1e1e1e;
            padding: 20px;
        }

        .book-stage-inner {
            position: relative;
            transition: transform 0.3s ease;
            transform-origin: center center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            background: #fff;
            display: flex;
            /* 양면 펼침을 위한 가로 배치 컨테이너 */
        }

        /* 양면 페이지 래퍼 */
        .pages-spread {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .page-pane {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        .page-pane img {
            display: block;
            max-height: 75vh;
            width: auto;
            object-fit: contain;
            background: white;
        }

        /* 진짜 책처럼 보이게 만드는 중앙 제본선 입체 그라데이션 */
        .book-center-shadow {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            pointer-events: none;
            background: linear-gradient(
                90deg, 
                rgba(0,0,0,0.15) 0%, 
                rgba(0,0,0,0.35) 48%, 
                rgba(255,255,255,0.6) 50%, 
                rgba(0,0,0,0.35) 52%, 
                rgba(0,0,0,0.15) 100%
            );
            z-index: 4;
        }

        /* 양옆 모서리 클릭 오버레이 영역 (다음/이전 페이지) */
        .edge-click {
            position: absolute;
            top: 0;
            width: 20%;
            height: 100%;
            z-index: 5;
            cursor: pointer;
        }
        .edge-left { left: 0; }
        .edge-right { right: 0; }

        .edge-left:hover {
            background: linear-gradient(90deg, rgba(0,0,0,0.06), transparent);
        }
        .edge-right:hover {
            background: linear-gradient(270deg, rgba(0,0,0,0.06), transparent);
        }
    </style>
</head>
<body>

    <!-- 상단 스포트라이트 조명 효과 -->
    <div class="spotlight-container"></div>

    <!-- 책 선택 화면 -->
    <div id="selection-view">
        <header>
            <h1>갤러리 설명서 보관소</h1>
            <p style="color: #6b5b45; font-size: 0.95rem; font-weight: 500;">보실 설명서 액자를 선택해주세요.</p>
        </header>
        <main id="book-selector">
            <!-- 6개의 책 표지가 액자 형태로 동적 생성됩니다 -->
        </main>
    </div>

    <!-- 로딩 화면 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="font-weight: bold; color: #444;">설명서 액자를 펼치는 중입니다...</p>
    </div>

    <!-- 독서 뷰어 화면 -->
    <div id="viewer-container">
        <div class="viewer-header">
            <!-- 홈 버튼 (벡터 아이콘 적용) -->
            <button class="retro-btn" onclick="goHome()">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>로비로</span>
            </button>
            
            <div id="page-indicator" style="font-weight: bold; font-size: 1.05rem; color: #3b2f2f;">1-2 / 10</div>
            
            <div class="viewer-controls">
                <!-- 축소 버튼 -->
                <button class="retro-btn" onclick="zoomOut()" title="축소">
                    <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                </button>
                <span id="zoom-level" style="font-size: 0.9rem; min-width: 45px; text-align: center; font-weight: bold;">100%</span>
                <!-- 확대 버튼 -->
                <button class="retro-btn" onclick="zoomIn()" title="확대">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
            </div>
        </div>

        <div class="viewer-stage" id="viewer-stage">
            <div class="book-stage-inner" id="book-stage-inner">
                <div class="pages-spread" id="pages-spread">
                    <!-- 좌우 양면 페이지 이미지 들어갈 자리 -->
                    <div class="page-pane"><img id="left-page-img" src="" alt="왼쪽 페이지"></div>
                    <div class="book-center-shadow"></div>
                    <div class="page-pane"><img id="right-page-img" src="" alt="오른쪽 페이지"></div>
                </div>
                <!-- 좌우 모서리 클릭 영역 -->
                <div class="edge-click edge-left" onclick="prevSpread()" title="이전 페이지"></div>
                <div class="edge-click edge-right" onclick="nextSpread()" title="다음 페이지"></div>
            </div>
        </div>
    </div>

    <script>
        // 6권의 책 설정 (총 6페이지 구성 가정: 표지 1장 + 본문 5장)
        const booksConfig = [
            { id: 1, title: "설명서 책 1", totalPages: 6 },
            { id: 2, title: "설명서 책 2", totalPages: 6 },
            { id: 3, title: "설명서 책 3", totalPages: 6 },
            { id: 4, title: "설명서 책 4", totalPages: 6 },
            { id: 5, title: "설명서 책 5", totalPages: 6 },
            { id: 6, title: "설명서 책 6", totalPages: 6 },
        ];

        let currentBookId = null;
        let currentSpreadIndex = 0; // 0: 표지 단독 또는 스프레드 첫 구간
        let currentTotalPages = 0;
        let currentZoom = 1;

        // 초기 박물관 액자 목록 렌더링
        function initBookSelector() {
            const selector = document.getElementById('book-selector');
            selector.innerHTML = '';

            booksConfig.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.onclick = () => loadBook(book.id);

                card.innerHTML = `
                    <img src="book_${book.id}/book_cover_${book.id}.png" alt="${book.title}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'140\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%23f4f0ea\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23888\' font-size=\'13\'>표지 준비중</text></svg>'">
                    <div class="book-card-title">${book.title}</div>
                `;
                selector.appendChild(card);
            });
        }

        // 책 로드 함수
        function loadBook(bookId) {
            currentBookId = bookId;
            const bookInfo = booksConfig.find(b => b.id === bookId);
            currentTotalPages = bookInfo.totalPages;
            currentSpreadIndex = 0; // 표지부터 시작 (스프레드 0번째: 표지는 단독 또는 좌측 배치)
            currentZoom = 1;
            updateZoomStyle();

            document.getElementById('loading-screen').style.display = 'flex';

            const testImg = new Image();
            testImg.src = getPageImagePath(bookId, 0);
            
            const handleLoadComplete = () => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('selection-view').style.display = 'none';
                document.getElementById('viewer-container').style.display = 'flex';
                renderSpread();
            };

            testImg.onload = handleLoadComplete;
            testImg.onerror = handleLoadComplete;
        }

        // 페이지 이미지 경로 규칙
        function getPageImagePath(bookId, pageIndex) {
            if (pageIndex === 0) {
                return `book_${bookId}/book_cover_${bookId}.png`;
            } else {
                return `book_${bookId}/book_${bookId}_${pageIndex}.png`;
            }
        }

        // 현재 양면 스프레드 페이지 렌더링
        function renderSpread() {
            const leftImg = document.getElementById('left-page-img');
            const rightImg = document.getElementById('right-page-img');
            const indicator = document.getElementById('page-indicator');

            if (currentSpreadIndex === 0) {
                // 첫 번째 스프레드: 표지를 왼쪽에 두고 우측은 빈 페이지 또는 공백 처리
                leftImg.src = getPageImagePath(currentBookId, 0);
                rightImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565"><rect width="100%" height="100%" fill="%23ffffff"/></svg>';
                indicator.textContent = `표지`;
            } else {
                // 본문 양면 보기 (예: 스프레드 1 -> 페이지 1, 2)
                let leftPageIndex = (currentSpreadIndex - 1) * 2 + 1;
                let rightPageIndex = leftPageIndex + 1;

                leftImg.src = getPageImagePath(currentBookId, leftPageIndex);
                
                if (rightPageIndex < currentTotalPages) {
                    rightImg.style.display = 'block';
                    rightImg.src = getPageImagePath(currentBookId, rightPageIndex);
                    indicator.textContent = `${leftPageIndex}, ${rightPageIndex} / ${currentTotalPages} 장`;
                } else {
                    // 마지막 페이지가 홀수여서 우측이 비는 경우
                    rightImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565"><rect width="100%" height="100%" fill="%23ffffff"/></svg>';
                    indicator.textContent = `${leftPageIndex} / ${currentTotalPages} 장`;
                }
            }
        }

        // 다음 스프레드(페이지 쌍)로 이동
        function nextSpread() {
            const maxSpread = Math.ceil((currentTotalPages - 1) / 2);
            if (currentSpreadIndex < maxSpread) {
                currentSpreadIndex++;
                renderSpread();
            }
        }

        // 이전 스프레드(페이지 쌍)로 이동
        function prevSpread() {
            if (currentSpreadIndex > 0) {
                currentSpreadIndex--;
                renderSpread();
            }
        }

        // 확대 (+)
        function zoomIn() {
            if (currentZoom < 2.5) {
                currentZoom += 0.25;
                updateZoomStyle();
            }
        }

        // 축소 (-)
        function zoomOut() {
            if (currentZoom > 0.75) {
                currentZoom -= 0.25;
                updateZoomStyle();
            }
        }

        function updateZoomStyle() {
            document.getElementById('book-stage-inner').style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-level').textContent = `${Math.round(currentZoom * 100)}%`;
        }

        // 홈(로비)으로 돌아가기
        function goHome() {
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('selection-view').style.display = 'block';
            currentBookId = theCurrentBookId = null;
        }

        // 키보드 좌우 방향키 연동
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('viewer-container').style.display === 'flex') {
                if (e.key === 'ArrowRight') {
                    nextSpread();
                } else if (e.key === 'ArrowLeft') {
                    prevSpread();
                }
            }
        });

        window.onload = initBookSelector;
    </script>
</body>
</html>
